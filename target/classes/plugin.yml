name: WirelessBooks
version: '26.2'
main: com.example.bookmod.BookPlugin
api-version: '26.2'
description: Create and share server-stored books without touching player inventories.
commands:
  book:
    description: Manage online books.
    usage: /<command> <create|remove|edit|access> <name> ...
    # Intentionally no "permission:" key -> usable by every player, no OP needed.
